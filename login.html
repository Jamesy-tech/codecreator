<!DOCTYPE html>
<html>
<head>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Codecreator</title>
    <style>
        body {
            margin: 0;
            background-color: aliceblue;
            background-image: url("BlockyMix.png");
            background-size: cover;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        * {
            font-family: monospace;
        }

        .signinWindow {
            width: 95vw;
            border: solid aquamarine 2px;
            outline: solid black 1px;
            height: 80vh;
            background: white;
            border-radius: 20px;
            padding: 20px;
        }

        .signininput {
            width: 90%;
            height: 30px;
            font-size: 16px;
            margin-top: 10px;
            padding-left: 5px;
            padding-right: 5px;
            font-family: monospace;
            border: solid black 1px;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .signininput:focus {
            font-size: 16px;
            outline: solid transparent 0px;
            background-size: cover;
        }

        .signinbtn {
            border-radius: 5px;
            width: 111px;
            height: 35px;
            cursor: pointer;
            border: solid black 1px;
            margin: 3px;
            margin-left: 6px;
            background: aquamarine;
        }

        .signinbtn:hover {
            background: palegreen;
            box-shadow: 2px 2px lightgray;
        }

        .signinbtn2 {
            background: transparent;
            transition: 0.3s;
            border: solid black 1px;
        }

        .signinbtn2:hover {
            background: yellow;
            outline: solid aquamarine 3px;
        }

        #usernameError {
            margin-top: 0px;
            margin-bottom: 9px;
        }

        gray {
            font-size: 28px;
            color: gray;
            display: inline-block;
        }

        big {
            font-size: 35px;
            font-weight: bold;
        }

        #usernameLoading {
            display: block;
        }

        #usernameLoading img {
            width: 80px;
        }

        .back {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        .back:hover {
            color: darkblue;
        }

        .login-container {
            width: 500px;
            border: solid black 1px;
        }

        .usernametext {
            margin-bottom: 0px;
            padding-bottom: 4px;
        }

        .undersearch-buttons {
            width: 140px;
            background: white;
            height: 32px;
            font-family: monospace;
            border-radius: 0px;
            box-shadow:4px 4px black;
            border: solid black 1px;
            transition: 0.3s;
          
        }

        .undersearch-buttons:hover {
            box-shadow:none;
            margin-left:4px;
            margin-top:4px;
        }

        .loading {
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .login-block {
            width: 400px;
            height: 400px;
            border-radius: 10px;
            background: white;
            padding-top: 40px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        #usernamesave {
            display: none;
            cursor: default;
        }
        
        #typewriter3 {
          display:none;
        }
      #username {
        display:none;
      }
      
      #loading {
        display:block;
      }
      #login {
        display:none;
      }
      
      .loadinggif {
        width:28%;
        margin-top:20px;
      }
      
    </style>
</head>
<body>

<center>

<div class="login-block">
  
    <center>
        <div id="loading">
          <img src="icon.png" class="loadinggif">
          </div>
          
      <div id="login">
        
        <h1 class="title" id="welcome"></h1>
        <span class="usernametext" id="undertext"></span>
        <input id="username" autocomplete="off" class="signininput" onkeydown="if(event.keyCode==13) saveUsername()" placeholder="">
       
        <k id="usernameError" style="color: red; display: none;">Please enter a valid username</k>
         <br>
        <button class="undersearch-buttons" onclick="saveUsername()" id="typewriter3"></button>
        <br><br>
        <span id="usernamesave">Applying username, please wait...</span>
    </center>

</div>

</div>
</center>

<script>
    function saveUsername() {
        var username = document.getElementById('username').value.trim();
        if (username === '') {
            document.getElementById('usernameError').style.display = 'block';
            document.getElementById("username").style.border = "solid red 1px";
            document.getElementById("username").focus();
            return;
        } else {
            document.getElementById('usernameError').style.display = 'none';
            document.getElementById("usernamesave").style.display = "block";
        }
        
        localStorage.setItem('codeusername', username);
        showSignIn2();
    }

    function showSignIn2() {
        setTimeout(() => {
           window.location.href = "editor.html";
        }, 1500);
    }
var i = 0;
var z = 0;
var y = 0;
var txt = "Sign in";
var txt2 = "Pick a username for your account";
var txt3 = "OK";
var speed = 1;
var speed2 = 1;
var speed3 = 1;

function typeWriter() {
  
  document.getElementById("login").style.display = "block";
  document.getElementById("loading").style.display = "none";
  
    if (i < txt.length) {
        document.getElementById("welcome").innerHTML += txt.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    } else {
        typeWriter2();
        document.getElementById("username").style.display = "block";
        
    document.getElementById("username").focus();
    }
}

function typeWriter2() {
    if (z < txt2.length) {
        document.getElementById("undertext").innerHTML += txt2.charAt(z);
        z++;
        setTimeout(typeWriter2, speed2);
    } else {
        typeWriter3();
           document.getElementById("typewriter3").style.display = "block";
    }
}

function typeWriter3() {
    if (y < txt3.length) {
        document.getElementById("typewriter3").innerHTML += txt3.charAt(y);
        y++;
        setTimeout(typeWriter3, speed3);
    } else {
   
    }
}

setTimeout(typeWriter, 1000)

        
        localStorage.setItem('codeusername', "Guest");
  document.getElementById("loading").style.display = "none";
</script>

</body>
</html>
