function importFile() {
  newDocument()

function runFile() {
    const codeContent = document.getElementById("editor").value;
    const fileName = document.getElementById("filename").value;
    const fileExtension = fileName.split('.').pop();

    let blob;
    switch (fileExtension) {
        case 'html':
            blob = new Blob([codeContent], { type: 'text/html' });
            break;
        case 'js':
            blob = new Blob([codeContent], { type: 'text/javascript' });
            break;
        case 'css':
            blob = new Blob([codeContent], { type: 'text/css' });
            break;
        case 'txt':
            blob = new Blob([codeContent], { type: 'text/plain' });
            break;
        default:
            alert("Unsupported file type.");
            return;
    }

    const fileURL = URL.createObjectURL(blob);
    const newTab = window.open(fileURL, '_blank');
    if (newTab) {
        newTab.focus();
        newTab.document.body.requestFullscreen();
    } else {
        alert("Unable to open new tab.");
    }
}

    const input = document.getElementById('search').value;

// Function to get URL search parameters
function getSearchParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
}

// Function to filter the list based on search input
function filterList(input) {
    const listItems = document.querySelectorAll('#savedList li');
    listItems.forEach(function(item) {
        if (item.textContent.toLowerCase().includes(input.toLowerCase())) {
            item.style.display = '';  // Show the item
        } else {
            item.style.display = 'none';  // Hide the item
        }
    });
}

// Function to handle filtering on load
function filterOnLoad() {
    const searchTerm = getSearchParam('q');
    
    if (searchTerm) {
        const searchInput = document.getElementById('search');
        searchInput.value = searchTerm;  // Set the search field value
        filterList(searchTerm);  // Trigger the list filtering
    }
}

 function setupAutoSave() {
    const autoSaveEnabled = localStorage.getItem("autoSave") === "true";
    const editor = document.getElementById('editor');
    const filenameInput = document.getElementById("filename");
    const saveValueDisplay = document.getElementById("saveValue");

    if (!editor || !filenameInput || !saveValueDisplay) {
        console.error("Required elements not found in the DOM");
        return; // Exit if elements are not found
    }

    editor.addEventListener('input', function() {
        if (autoSaveEnabled) {
            if (filenameInput.value === 'untitled.txt') {
                // Do nothing if the filename is "Untitled Document"
                return;
            } else {
                saveValueDisplay.textContent = "Saving...";

                // Simulate saving delay
                setTimeout(() => {
                    saveValueDisplay.textContent = "Saved";
                    saveContentToList(); // Call the save function
                }, 2300);
            }
        } else {
            saveValueDisplay.textContent = "Not Saved";
        }
    });
}

document.getElementById('editor').addEventListener('keydown', function(event) {
    if (event.key === 'Tab') {
        event.preventDefault(); // Prevent the default tab action
        const start = this.selectionStart;
        const end = this.selectionEnd;

        // Insert 4 spaces (or a tab character)
        this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
        // Move the cursor after the inserted spaces
        this.selectionStart = this.selectionEnd = start + 4;
    }

function saveContentToList() {
 
    const textArea = document.getElementById('editor');
    const fileNameInput = document.getElementById('filename');
    const content = textArea.value.trim();
    const fileName = fileNameInput.value.trim();

    if (content && fileName) {
        const savedContents = JSON.parse(localStorage.getItem('textAreaContents')) || [];
        const timestamp = new Date().toLocaleString();
 document.getElementById("saveValue").textContent = "Saved"
        // Check if the fileName already exists
        const existingIndex = savedContents.findIndex(item => item.fileName === fileName);

        if (existingIndex !== -1) {
            // If it exists, update the existing item
            savedContents[existingIndex] = { content, fileName, timestamp };
        } else {
            // If it doesn't exist, add a new item
            savedContents.push({ content, fileName, timestamp });
        }

        localStorage.setItem('textAreaContents', JSON.stringify(savedContents));
        loadSavedItems();
        document.getElementById("saveButton").textContent = "Saved to Scripts";

        setTimeout(() => {
            document.getElementById("saveButton").textContent = "Save to Scripts";
        }, 2000);

    } else {
        document.getElementById("saveButton").textContent = "Error;";

        setTimeout(() => {
            document.getElementById("saveButton").textContent = "Enter name";
        }, 800);

        setTimeout(() => {
            document.getElementById("saveButton").textContent = "Save to Scripts";
        }, 2000);
    }
}


// Load saved items to the list
function loadSavedItems() {
    const savedList = document.getElementById('savedList');
    const savedContents = JSON.parse(localStorage.getItem('textAreaContents')) || [];
    savedList.innerHTML = ''; // Clear current list

    savedContents.forEach((item, index) => {
        // Create list item with content name
        const listItem = document.createElement('li');
        listItem.innerHTML = ` <span class="font" onclick="loadContent(${index})">${item.fileName} </span>&nbsp;&nbsp;&nbsp;
                              <button class="remove button48" onclick="loadContent(${index})">Edit</button> <button onclick="deleteContent(${index})" class="button48">Delete</button>`;
        savedList.appendChild(listItem);
    });
}

// Load content back into the text area
function loadContent(index) {
  
    const savedContents = JSON.parse(localStorage.getItem('textAreaContents')) || [];
    const textArea = document.getElementById('editor');
    const fileNameInput = document.getElementById('filename');
    textArea.value = savedContents[index].content; // Load the selected content into the text area
    fileNameInput.value = savedContents[index].fileName; // Load the name back into the input
    
    documentEditor()
}

// Delete content from the list
function deleteContent(index) {
    let savedContents = JSON.parse(localStorage.getItem('textAreaContents')) || [];
    savedContents.splice(index, 1); // Remove the item at the given index
    localStorage.setItem('textAreaContents', JSON.stringify(savedContents));
    loadSavedItems(); // Reload the updated list
}

// Load saved items when the page is loaded
window.onload = loadSavedItems;

    function download() {
    const textToSave = document.getElementById('editor').value;
    const blob = new Blob([textToSave], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    
    const filename = document.getElementById('filename').value || 'untitled.txt';
    
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);
  }
  
    function openFile() {
      const fileInput = document.getElementById('fileInput');
      fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          const text = e.target.result;
          document.getElementById('editor').value = text;
        };
        reader.readAsText(file);
      });
      fileInput.click();
    }

function updateEditor() {
  var editorContent = document.getElementById('editor').textContent;
  var codeElement = document.createElement('code');
  codeElement.textContent = editorContent;
  // Apply syntax highlighting
  Prism.highlightElement(codeElement);
  // Update the editor with the highlighted code
  document.getElementById('editor').innerHTML = codeElement.innerHTML;
}

// Listen for input events on the editor
document.getElementById('editor').addEventListener('input', updateEditor);



        document.addEventListener('DOMContentLoaded', () => {
            // Function to get URL parameters
            function getQueryParams() {
                const params = new URLSearchParams(window.location.search);
                return Object.fromEntries(params.entries());
            }

            const queryParams = getQueryParams();
            const type = queryParams.type;

            if (type === 'html') {
                document.getElementById("editor").spellcheck = false;
                document.getElementById('editor').style.fontFamily = 'Courier New, Courier, monospace';
                document.getElementById("filename").textContent = "untitled.html";
  
            } else if (type === 'txt') {
              
                       document.getElementById("editor").spellcheck = true;
                document.getElementById("x").style.display = "none";
                
            }  else if (type === 'css') {
                
                             document.getElementById("editor").spellcheck = false;
